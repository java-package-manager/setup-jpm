name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # jpm releases keep coming; check the action still installs the newest weekly
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }} (${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        version: [latest, canary]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - id: jpm
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: jpm and jvm are on PATH
        run: |
          set -eux
          jpm --version
          jvm --version
          test -n "${{ steps.jpm.outputs.version }}"
          test -f "${{ steps.jpm.outputs.path }}"
          case "${{ matrix.version }}" in
            canary) echo "${{ steps.jpm.outputs.version }}" | grep -Eq -- '-[0-9a-f]{7}$' ;;
            *) echo "${{ steps.jpm.outputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' ;;
          esac

      - name: Build and test a new project
        run: |
          set -eux
          cd "$RUNNER_TEMP"
          rm -rf demo && mkdir demo && cd demo
          jpm init demo
          jpm add --test org.junit.jupiter:junit-jupiter
          jpm test
          jpm build
          jpm start | tee out.txt
          test -s out.txt

  java:
    name: java input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: jpm
        uses: ./
        with:
          java: "17"
          cache: "false"
      - run: |
          set -eux
          test -n "${{ steps.jpm.outputs.java-home }}"
          test "$JAVA_HOME" = "${{ steps.jpm.outputs.java-home }}"
          java -version 2>&1 | tee v.txt
          grep -q 'version "17' v.txt

  pinned:
    name: pinned version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: jpm
        uses: ./
        with:
          version: "0.6.0"
          cache: "false"
      - run: test "${{ steps.jpm.outputs.version }}" = "0.6.0"

  missing:
    name: unknown version fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: jpm
        continue-on-error: true
        uses: ./
        with:
          version: "0.0.404"
          cache: "false"
      - run: test "${{ steps.jpm.outcome }}" = failure

  # A push to main whose VERSION has no tag yet is released, once every test passes: tag v<VERSION>, a
  # GitHub release, and the major tag (v1) moved to it, so `uses: NonSwag/setup-jpm@v1` gets it.
  release:
    name: release
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [install, java, pinned, missing]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Release a new version
        run: |
          set -eu
          version=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::VERSION must be a version such as 1.2.3, not \"$version\""
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"
            exit 0
          fi
          pre=""
          case "$version" in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" --target "$GITHUB_SHA" --title "setup-jpm $tag" --generate-notes $pre
          echo "::notice::released $tag"
          # v1 follows the newest 1.x release (not pre-releases)
          if [ -z "$pre" ]; then
            major="v${version%%.*}"
            git tag -f "$major" "$GITHUB_SHA"
            git push -f origin "refs/tags/$major"
            echo "::notice::moved $major to $tag"
          fi
